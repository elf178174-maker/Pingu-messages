name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build the release from (for example v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The secrets context cannot be read from a step's `if:`, so the one thing the steps need to
    # know - whether a keystore was configured at all - is resolved once here, where it can.
    env:
      HAS_KEYSTORE: ${{ secrets.PINGU_KEYSTORE_BASE64 != '' && 'yes' || 'no' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Signing is optional. With no secrets configured the release APK is signed with the standard
      # Android debug key, which still installs on any device; a project that sets the four
      # PINGU_KEYSTORE_* secrets gets a properly signed build with no other change.
      - name: Restore the signing keystore
        if: env.HAS_KEYSTORE == 'yes'
        env:
          KEYSTORE_BASE64: ${{ secrets.PINGU_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PINGU_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APKs
        env:
          PINGU_KEYSTORE_PASSWORD: ${{ secrets.PINGU_KEYSTORE_PASSWORD }}
          PINGU_KEY_ALIAS: ${{ secrets.PINGU_KEY_ALIAS }}
          PINGU_KEY_PASSWORD: ${{ secrets.PINGU_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Collect the artifacts
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/
          cp app/build/outputs/apk/debug/*.apk release/
          ls -l release

      - name: Write the release notes
        run: |
          {
            echo "## Pingu Messages ${GITHUB_REF_NAME}"
            echo
            echo "A privacy-respecting SMS and MMS app for Android. Install the APK below."
            echo
            echo "### Installing"
            echo
            echo "1. Download \`pingu-messages-release-*.apk\`."
            echo "2. Open it on your phone and allow installation from this source when asked."
            echo "3. Open the app and follow the prompt to make it your default SMS app."
            echo
            echo "### Notes"
            echo
            echo "- Requires Android 8.0 (API 26) or newer."
            echo "- SMS and MMS only. RCS is not available to third-party apps; see the README."
            if [ "$HAS_KEYSTORE" != "yes" ]; then
              echo "- This build is signed with the standard Android debug key, so it installs"
              echo "  for testing but cannot be published to the Play Store as is."
            fi
            echo
            echo "### Changes"
            echo
            git log --pretty=format:'- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" || true
          } > release-notes.md
          cat release-notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Pingu Messages ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release/*.apk
          draft: false
          prerelease: false
