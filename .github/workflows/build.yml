name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Resources are compiled first and without --stacktrace: an aapt2 failure prints a
      # readable "file:line: error" that a hundred lines of Gradle stack trace would bury.
      - name: Compile resources
        run: ./gradlew processDebugResources --console=plain

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Assemble the release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pingu-messages-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: pingu-messages-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Everything below this line is verification rather than delivery, so it runs once the
      # installable artifacts are already uploaded and safe.
      - name: Compile the instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --console=plain

      # Lint runs after the APKs exist. It is advisory here, and a slow or unhappy lint should
      # never be the reason a build produces no installable artifact.
      - name: Lint
        run: ./gradlew lintDebug --console=plain
        continue-on-error: true

      - name: Upload the exported database schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
